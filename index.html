    <script>
      (function () {
        function isBenign(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || val.reason || String(val));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function (e) {
          if (isBenign(e.reason) || isBenign(e)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (e) {
          if (isBenign(e.message) || isBenign(e.error) || isBenign(e)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
